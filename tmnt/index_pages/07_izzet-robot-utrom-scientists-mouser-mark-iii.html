      --text: #ecf2fb;
      --muted: #9dafc8;

    * { box-sizing: border-box; }
    body {

      color: var(--text);

      background: radial-gradient(circle at top, #132849, var(--bg) 58%);
      overflow: hidden;

    a { color: inherit; text-decoration: none; }
    button {

      color: var(--text);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    button.active {
      background: rgba(92, 200, 255, 0.18);
      border-color: rgba(92, 200, 255, 0.45);
    }
    .toolbar {
      position: fixed;
      inset: 16px 16px auto 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      pointer-events: none;
    }
    .toolbar .group, .panel, .selection, .mini-nav, .legend-panel {
      pointer-events: auto;
    }
    .group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);

    .title-wrap strong { display: block; font-size: 16px; }
    .title-wrap span { color: var(--muted); font-size: 12px; }
    .canvas-wrap {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    svg.is-dragging { cursor: grabbing; }
    .map-controls {
      position: fixed;
      left: 16px;
      top: 96px;
      z-index: 9;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      max-width: min(420px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
      pointer-events: auto;
    }
    .map-controls .hint {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .mini-nav {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 8;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      max-width: min(360px, calc(100vw - 32px));
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
    }
    .mini-nav strong { display: block; margin: 0; }
    .mini-nav-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }
    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .mini-nav .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255,255,255,0.04);
    }
    .chip small {
      color: var(--muted);
      font-size: 11px;
    }
    .chip-button {
      padding: 4px 8px;
      font-size: 12px;
      background: rgba(255,255,255,0.04);
      color: var(--muted);
    }
    .chip-button.active {
      background: rgba(92, 200, 255, 0.18);
      border-color: rgba(92, 200, 255, 0.45);
      color: var(--text);
    }
    .chip-button.is-clickable { cursor: pointer; }
    .quick-note {
      min-height: 16px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .legend-panel {
      position: fixed;
      right: 16px;
      top: 86px;
      z-index: 8;
      width: min(340px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
    }
    .legend-panel strong { display: block; margin-bottom: 8px; }
    .legend-grid { display: grid; gap: 8px; }
    .legend-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .legend-samples {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 20px;
    }
    .legend-node {
      display: inline-block;
      border-radius: 50%;
      border: 2px solid rgba(236, 242, 251, 0.9);
      background: rgba(92, 200, 255, 0.35);
    }
    .legend-node.sm { width: 10px; height: 10px; }
    .legend-node.md { width: 16px; height: 16px; }
    .legend-node.lg { width: 24px; height: 24px; }
    .legend-node.pick { background: rgba(244, 201, 93, 0.42); }
    .legend-edge {
      display: inline-block;
      width: 40px;
      border-top: 2px solid rgba(92, 200, 255, 0.9);
      border-radius: 999px;
    }
    .legend-edge.strong { border-top-width: 6px; }
    .legend-edge.pick { border-top-color: rgba(244, 201, 93, 0.92); }
    .legend-edge.none {
      border-top-width: 0;
      height: 10px;
      border: 1px dashed rgba(157, 175, 200, 0.45);
      width: 40px;
    }
    .legend-area {
      width: 38px;
      height: 22px;
      border-radius: 12px;
      background: rgba(92, 200, 255, 0.14);
      border: 1px solid rgba(92, 200, 255, 0.25);
    }
    .selection {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 8;
      width: min(420px, calc(100vw - 32px));
      max-height: 40vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
    }
    .selection.hidden { display: none; }
    .selection strong { display: block; margin-bottom: 6px; }
    .card-modal {
      position: fixed;
      left: 50%;
      top: 86px;
      transform: translateX(-50%);
      z-index: 12;
      width: min(920px, calc(100vw - 32px));
      max-height: calc(100vh - 120px);
      overflow: auto;
      background: linear-gradient(180deg, rgba(13,20,34,0.98), rgba(10,17,31,0.98));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 28px 72px rgba(0,0,0,0.52);
      padding: 18px;
    }
    .card-modal.hidden { display: none; }
    .help-popover {
      position: fixed;
      left: 50%;
      top: 112px;
      transform: translateX(-50%);
      z-index: 13;
      width: min(420px, calc(100vw - 32px));
      max-height: min(52vh, 420px);
      overflow: auto;
      background: linear-gradient(180deg, rgba(13,20,34,0.99), rgba(10,17,31,0.99));
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 28px 72px rgba(0,0,0,0.52);
      padding: 16px 18px 18px;

      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

      display: block;
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    .help-popover-close {
      padding: 4px 9px;
      font-size: 12px;
    }
    .help-popover-body {
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }
    .help-popover-body strong {
      color: var(--text);
    }

      display: grid;
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
      gap: 18px;
    }
    .card-modal-close {
      position: sticky;
      top: 0;
      float: right;
      margin-left: auto;
      margin-bottom: 10px;
    }

      width: 100%;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      overflow: hidden;

    }
    .card-shot img {
      display: block;
      width: 100%;
      height: auto;
    }
    .card-shot .muted {
      padding: 12px;
    }
    .spotlight-head {

      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

      font-size: 28px;
      line-height: 1.1;
    }
    .spotlight-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .spotlight-grid {

      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
    }

      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

      height: 18px;
      margin-left: 6px;
      padding: 0;

      font-size: 11px;
      line-height: 1;
      vertical-align: middle;

    .spotlight-kpi strong {
      display: block;
      margin-top: 4px;
      font-size: 18px;
    }
    .spotlight-section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);

      margin: 0 0 8px;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

      position: fixed;
      top: 0;
      right: 0;
      width: min(420px, 92vw);

      z-index: 14;
      display: none;
      background: rgba(0, 0, 0, 0.25);

      var shellScore = node.shell_dependence_score != null ? node.shell_dependence_score : (node.build_around_score || 0);
      setSelection('<strong>' + node.id + '</strong><div class="muted">' + segment.title + '</div><div style="margin-top:8px">Analysis ' + node.analysis_score.toFixed(1) + ' / 10 | Pick ' + node.pick_priority_score.toFixed(1) + ' / 10 | Shell dependence ' + shellScore.toFixed(1) + ' / 10</div>');
      nodeDetail(node);
    };
    g.addEventListener('pointerdown', function(evt) {
      startNodeDrag(node, evt, onNodeClick);
    });
    group.appendChild(g);
  }
  function draw() {
    prepareViewState();
    clear(svg);
    if (!(nodeDragState && nodeDragState.moved)) {
      renderQuickChips();
      renderLegend();
      if (drawer.classList.contains('open')) renderDrawer();
    }
    if (access.formatLocked) {
      closeModal();
      setSelection('<strong>Members only format</strong><div class="muted" style="margin-top:8px">This set is currently behind the paywall. The public homepage still shows the archetype list.</div>');
      return;
    }
    if (!visibleNodes.length) {
      setSelection('<strong>No cards shown</strong><div class="muted" style="margin-top:8px">The active filters removed every node in this archetype view. Turn off one of the filters to widen the graph.</div>');
      return;
    }
    viewportGroup = svgEl('g');
    var bg = svgEl('g');
    var edges = svgEl('g');
    var nodes = svgEl('g');
    var labels = svgEl('g');
    viewportGroup.appendChild(bg);
    viewportGroup.appendChild(edges);
    viewportGroup.appendChild(nodes);
    viewportGroup.appendChild(labels);
    svg.appendChild(viewportGroup);
    applyViewportTransform();
    segment.communities.forEach(function(community) {
      var members = visibleNodes.filter(function(node) { return node.community === community.community_id; });
      if (members.length < 2) return;
      var pad = Math.max(24, Math.min(40, members.reduce(function(sum, node) { return sum + currentNodeRadius(node); }, 0) / members.length + 12));
      var minX = Math.min.apply(null, members.map(function(node) { return node.x - currentNodeRadius(node); })) - pad;
      var maxX = Math.max.apply(null, members.map(function(node) { return node.x + currentNodeRadius(node); })) + pad;
      var minY = Math.min.apply(null, members.map(function(node) { return node.y - currentNodeRadius(node); })) - pad;
      var maxY = Math.max.apply(null, members.map(function(node) { return node.y + currentNodeRadius(node); })) + pad;
      var knotOpacity = (0.03 + 0.12 * communityConfidence(community)).toFixed(3);
      var knotRect = svgEl('rect', { x: minX, y: minY, width: maxX - minX, height: maxY - minY, rx: 42, fill: communityPalette[community.community_id % communityPalette.length], opacity: knotOpacity });
      knotRect.style.cursor = 'pointer';
      bindInteractiveTarget(knotRect, function() {
        communityDetail(community);
      });
      bg.appendChild(knotRect);
    });
    var nodeMap = visibleNodeMap;
    var sortedEdges = visibleEdges;
    var maxEdge = Math.max.apply(null, sortedEdges.map(function(edge) { return displayEdgeScore(edge); }).concat([0.01]));
    sortedEdges.forEach(function(edge) {
      var direction = edgeDirection(edge);
      if (!direction) return;
      var signal = Math.pow(Math.max(0.0, displayEdgeScore(edge)) / maxEdge, 0.62);
      var confidence = edgeConfidence(edge);
      var width = 1.0 + 2.4 * confidence + 4.8 * signal;
      var alpha = 0.12 + 0.76 * confidence;
      var stroke = mode === 'analysis'
        ? 'rgba(92, 200, 255, ' + alpha.toFixed(3) + ')'
        : 'rgba(244, 201, 93, ' + alpha.toFixed(3) + ')';
      var geometry = edgeGeometry(direction, width);
      var edgeGroup = svgEl('g');
      var line = svgEl('line', {
        x1: geometry.x1,
        y1: geometry.y1,
        x2: geometry.x2,
        y2: geometry.y2,
        stroke: stroke,
        'stroke-width': width.toFixed(2),
        'stroke-linecap': 'round'
      });
      var arrow = svgEl('polygon', {
        points: geometry.tipX + ',' + geometry.tipY + ' ' + geometry.leftX + ',' + geometry.leftY + ' ' + geometry.rightX + ',' + geometry.rightY,
        fill: stroke,
        stroke: 'none'
      });
      var hitLine = svgEl('line', {
        x1: geometry.x1,
        y1: geometry.y1,
        x2: geometry.tipX,
        y2: geometry.tipY,
        stroke: 'transparent',
        'stroke-width': Math.max(10, width + 8).toFixed(2),
        'stroke-linecap': 'round'
      });
      edgeGroup.setAttribute('class', 'edge-hit');
      edgeGroup.style.cursor = 'pointer';
      edgeGroup.appendChild(line);
      edgeGroup.appendChild(arrow);
      edgeGroup.appendChild(hitLine);
      bindInteractiveTarget(edgeGroup, function() {
        edgeDetail(edge);
      });
      edges.appendChild(edgeGroup);
    });
    var sortedNodes = visibleNodes.slice().sort(function(a, b) { return currentNodeRadius(b) - currentNodeRadius(a); });
    sortedNodes.forEach(function(node) {
      drawNode(nodes, node);
      if (!shouldLabel(node)) return;
      var text = svgEl('text', { x: node.x + currentNodeRadius(node) + 4, y: node.y + 4, fill: '#edf2fb', 'font-size': 13, 'pointer-events': 'none' });
      text.textContent = node.label;
      labels.appendChild(text);
    });
    syncFloatingLayout();
  }
  analysisBtn.addEventListener('click', function() {
    mode = 'analysis';
    analysisBtn.classList.add('active');
    pickBtn.classList.remove('active');
    trackEvent('view_mode_selected', { view_mode: 'analysis' });
    draw();
  });
  pickBtn.addEventListener('click', function() {
    mode = 'pick';
    pickBtn.classList.add('active');
    analysisBtn.classList.remove('active');
    trackEvent('view_mode_selected', { view_mode: 'pick' });
    draw();
  });
  buildAroundBtn.addEventListener('click', function() {
    if (access.premiumFilters.buildArounds) {
      premiumMessage('Build-around filtering');
      return;
    }
    filters.buildArounds = !filters.buildArounds;
    buildAroundBtn.classList.toggle('active', filters.buildArounds);
    draw();
  });
  topSynergyBtn.addEventListener('click', function() {
    if (access.premiumFilters.topSynergies) {
      premiumMessage('Top synergies filtering');
      return;
    }
    filters.topSynergies = !filters.topSynergies;
    topSynergyBtn.classList.toggle('active', filters.topSynergies);
    draw();
  });
  coreBtn.addEventListener('click', function() {
    if (access.premiumFilters.coreOnly) {
      premiumMessage('Core-only filtering');
      return;
    }
    filters.coreOnly = !filters.coreOnly;
    coreBtn.classList.toggle('active', filters.coreOnly);
    draw();
  });
  labelsBtn.addEventListener('click', function() {
    showLabels = !showLabels;
    labelsBtn.classList.toggle('active', showLabels);
    labelsBtn.textContent = showLabels ? 'Labels On' : 'Labels Off';
    draw();
  });
  quickAnalysisBtn.addEventListener('click', function() {
    quickMode = 'analysis';
    trackEvent('quick_mode_selected', { quick_mode: 'analysis', view_mode: mode });
    renderQuickChips();
  });
  quickBoostersBtn.addEventListener('click', function() {
    quickMode = 'boosters';
    trackEvent('quick_mode_selected', { quick_mode: 'boosters', view_mode: mode });
    renderQuickChips();
  });
  quickBuildBtn.addEventListener('click', function() {
    if (access.premiumQuickRead.buildArounds) {
      premiumMessage('Quick Read build-around detector');
      return;
    }
    quickMode = 'builds';
    trackEvent('quick_mode_selected', { quick_mode: 'builds', view_mode: mode });
    renderQuickChips();
  });
  quickRarityButtons.forEach(function(button) {
    button.addEventListener('click', function() {
      quickRarity = button.getAttribute('data-rarity') || 'all';
      renderQuickChips();
    });
  });
  zoomOutBtn.addEventListener('click', function() { zoomAt(1 / 1.18); });
  resetViewBtn.addEventListener('click', resetViewport);
  resetLayoutBtn.addEventListener('click', function() {
    resetStoredLayout();
    trackEvent('layout_reset', { view_mode: mode });
    draw();
  });
  exportLayoutsBtn.addEventListener('click', function() {
    var layouts = collectFormatLayouts();
    var filename = (formatCode().toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'format') + '-layouts.json';
    downloadJson(filename, layouts);
    trackEvent('layout_export', { view_mode: mode, layout_count: Object.keys(layouts).length });
  });
  importLayoutBtn.addEventListener('click', function() {
    importLayoutInput.value = '';
    importLayoutInput.click();
  });
  importLayoutInput.addEventListener('change', function() {
    var file = importLayoutInput.files && importLayoutInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        var parsed = JSON.parse(String(reader.result || '{}'));
        if (!applyImportedLayout(parsed)) {
          setSelection('<strong>Layout import failed</strong><div class="muted" style="margin-top:8px">The JSON did not contain positions for this archetype page.</div>');
        }
      } catch (err) {
        setSelection('<strong>Layout import failed</strong><div class="muted" style="margin-top:8px">' + esc(String(err)) + '</div>');
      }
    };
    reader.readAsText(file);
  });
  zoomInBtn.addEventListener('click', function() { zoomAt(1.18); });
  quickToggleBtn.addEventListener('click', toggleQuickRead);
  legendToggleBtn.addEventListener('click', toggleLegend);
  drawerBtn.addEventListener('click', toggleDrawer);
  drawerOverlay.addEventListener('click', closeDrawer);
  window.addEventListener('pointermove', function(evt) {
    if (!nodeDragState || nodeDragState.pointerId !== evt.pointerId) return;
    var point = svgPointFromClient(evt.clientX, evt.clientY);
    var dx = point.x - nodeDragState.startPoint.x;
    var dy = point.y - nodeDragState.startPoint.y;
    if (!nodeDragState.moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
      nodeDragState.moved = true;
      suppressClickUntil = Date.now() + 180;
      if (svg.setPointerCapture) {
        try {
          svg.setPointerCapture(evt.pointerId);
          nodeDragState.captured = true;
        } catch (err) {}
      }
    }
    if (!nodeDragState.moved) return;
    var node = findNodeById(nodeDragState.nodeId);
    if (!node) return;
    node.x = nodeDragState.startX + dx;
    node.y = nodeDragState.startY + dy;
    scheduleDraw();
    evt.preventDefault();
  }, { passive: false });
  function endNodeDrag(evt) {
    if (!nodeDragState) return;
    if (evt && evt.pointerId !== undefined && nodeDragState.pointerId !== evt.pointerId) return;
    var shouldRedraw = !!nodeDragState.moved;
    var pointerId = nodeDragState.pointerId;
    var wasCaptured = !!nodeDragState.captured;
    var clickHandler = nodeDragState.clickHandler;
    if (nodeDragState.moved) {
      saveCurrentLayout();
      trackEvent('layout_node_drag', { view_mode: mode, card: nodeDragState.nodeId });
      suppressClickUntil = Date.now() + 220;
    }
    nodeDragState = null;
    if (wasCaptured && svg.releasePointerCapture) {
      try { svg.releasePointerCapture(pointerId); } catch (err) {}
    }
    if (!shouldRedraw && clickHandler && !shouldSuppressClick()) {
      clickHandler(evt);
      suppressClickUntil = Date.now() + 220;
    }
    if (shouldRedraw) draw();
  }
  function cancelNodeDrag() {
    endNodeDrag();
  }
  window.addEventListener('pointerup', endNodeDrag);
  window.addEventListener('pointercancel', endNodeDrag);
  window.addEventListener('mouseup', cancelNodeDrag);
  window.addEventListener('blur', cancelNodeDrag);
  svg.addEventListener('pointerup', endNodeDrag);
  svg.addEventListener('pointercancel', endNodeDrag);
  svg.addEventListener('lostpointercapture', cancelNodeDrag);
  svg.addEventListener('wheel', function(evt) {
    evt.preventDefault();
    zoomAt(evt.deltaY < 0 ? 1.14 : (1 / 1.14), evt.clientX, evt.clientY);
  }, { passive: false });
  svg.addEventListener('pointerdown', function(evt) {
    if (evt.button !== undefined && evt.button !== 0) return;
    if (nodeDragState) return;
    if (blocksPan(evt.target)) return;
    dragState = {
      pointerId: evt.pointerId,
      startPoint: svgPointFromClient(evt.clientX, evt.clientY),
      startTx: viewState.tx,
      startTy: viewState.ty,
      moved: false
    };
    suppressClickUntil = 0;
    if (svg.setPointerCapture) svg.setPointerCapture(evt.pointerId);
  });
  svg.addEventListener('pointermove', function(evt) {
    if (!dragState || dragState.pointerId !== evt.pointerId) return;
    var point = svgPointFromClient(evt.clientX, evt.clientY);
    var dx = point.x - dragState.startPoint.x;
    var dy = point.y - dragState.startPoint.y;
    if (!dragState.moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
      dragState.moved = true;
      svg.classList.add('is-dragging');
    }
    if (!dragState.moved) return;
    viewState.tx = dragState.startTx + dx;
    viewState.ty = dragState.startTy + dy;
    applyViewportTransform();
    suppressClickUntil = Date.now() + 120;
    evt.preventDefault();
  });
  function endPan(evt) {
    if (!dragState) return;
    if (evt && dragState.pointerId !== evt.pointerId) return;
    if (evt && svg.releasePointerCapture) {
      try { svg.releasePointerCapture(evt.pointerId); } catch (err) {}
    }
    dragState = null;
    svg.classList.remove('is-dragging');
  }
  svg.addEventListener('pointerup', endPan);
  svg.addEventListener('pointercancel', endPan);
  svg.addEventListener('click', function() {
    if (shouldSuppressClick()) return;
    clearSelection();
    closeModal();
  });
  document.addEventListener('keydown', function(evt) {
    if (evt.key === 'Escape') {
      closeDrawer();
      closeModal();
      clearSelection();
    }
  });
  window.addEventListener('resize', syncFloatingLayout);
  loadSavedLayout();
  loadAccessConfig();
  renderQuickChips();
  draw();
})();
</script>
</body>
</html>
