      cursor: pointer;

    button.active {

      border-color: rgba(92, 200, 255, 0.45);
    }
    .toolbar {

      inset: 16px 16px auto 16px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      pointer-events: none;
    }
    .toolbar .group, .panel, .selection, .mini-nav, .legend-panel {
      pointer-events: auto;
    }
    .group {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);

    .title-wrap strong { display: block; font-size: 16px; }
    .title-wrap span { color: var(--muted); font-size: 12px; }
    .canvas-wrap {

      height: 100vh;
      position: relative;
      overflow: hidden;

    svg {

      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;

    .map-controls {
      position: fixed;
      left: 16px;
      top: 96px;
      z-index: 9;

      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      max-width: min(420px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
      pointer-events: auto;
    }
    .map-controls .hint {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .mini-nav {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 8;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      max-width: min(360px, calc(100vw - 32px));
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
    }
    .mini-nav strong { display: block; margin: 0; }
    .mini-nav-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }
    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .mini-nav .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255,255,255,0.04);
    }
    .chip small {
      color: var(--muted);
      font-size: 11px;
    }
    .chip-button {
      padding: 4px 8px;
      font-size: 12px;
      background: rgba(255,255,255,0.04);
      color: var(--muted);
    }
    .chip-button.active {
      background: rgba(92, 200, 255, 0.18);
      border-color: rgba(92, 200, 255, 0.45);
      color: var(--text);
    }
    .chip-button.is-clickable { cursor: pointer; }
    .quick-note {
      min-height: 16px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .legend-panel {
      position: fixed;
      right: 16px;
      top: 86px;
      z-index: 8;
      width: min(340px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
    }
    .legend-panel strong { display: block; margin-bottom: 8px; }
    .legend-grid { display: grid; gap: 8px; }
    .legend-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .legend-samples {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 20px;
    }
    .legend-node {
      display: inline-block;
      border-radius: 50%;
      border: 2px solid rgba(236, 242, 251, 0.9);
      background: rgba(92, 200, 255, 0.35);
    }
    .legend-node.sm { width: 10px; height: 10px; }
    .legend-node.md { width: 16px; height: 16px; }
    .legend-node.lg { width: 24px; height: 24px; }
    .legend-node.pick { background: rgba(244, 201, 93, 0.42); }
    .legend-edge {
      display: inline-block;
      width: 40px;
      border-top: 2px solid rgba(92, 200, 255, 0.9);
      border-radius: 999px;

    .legend-edge.strong { border-top-width: 6px; }
    .legend-edge.pick { border-top-color: rgba(244, 201, 93, 0.92); }
    .legend-edge.none {
      border-top-width: 0;
      height: 10px;
      border: 1px dashed rgba(157, 175, 200, 0.45);
      width: 40px;
    }
    .legend-area {
      width: 38px;
      height: 22px;
      border-radius: 12px;
      background: rgba(92, 200, 255, 0.14);
      border: 1px solid rgba(92, 200, 255, 0.25);
    }
    .selection {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 8;
      width: min(420px, calc(100vw - 32px));
      max-height: 40vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
    }

    .selection strong { display: block; margin-bottom: 6px; }
    .card-modal {

      left: 50%;
      top: 86px;

    .help-popover {

      left: 50%;
      top: 112px;
      transform: translateX(-50%);

      max-height: min(52vh, 420px);
      overflow: auto;
      background: linear-gradient(180deg, rgba(13,20,34,0.99), rgba(10,17,31,0.99));

      border-radius: 18px;

      padding: 16px 18px 18px;

      gap: 12px;
      align-items: center;

      margin: 0;
      font-size: 14px;

    .help-popover-close {
      padding: 4px 9px;
      font-size: 12px;
    }
    .help-popover-body {

      font-size: 13px;
      line-height: 1.5;
    }
    .help-popover-body strong {
      color: var(--text);
    }

      display: grid;
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
      gap: 18px;

    .card-modal-close {
      position: sticky;
      top: 0;
      float: right;
      margin-left: auto;
      margin-bottom: 10px;
    }

      border: 1px solid var(--line);

      width: 100%;
      height: auto;

      font-size: 28px;
      line-height: 1.1;

      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .spotlight-grid {

      gap: 10px;
      margin-bottom: 14px;
    }

      border-radius: 14px;

      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

      font-size: 11px;
      line-height: 1;
      vertical-align: middle;

      display: block;
      margin-top: 4px;
      font-size: 18px;
    }

      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);

      margin: 0 0 8px;
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

      top: 0;
      right: 0;

    applyViewportTransform();
    suppressClickUntil = Date.now() + 120;
    evt.preventDefault();
  });
  function endPan(evt) {
    if (!dragState) return;
    if (evt && dragState.pointerId !== evt.pointerId) return;
    if (evt && svg.releasePointerCapture) {
      try { svg.releasePointerCapture(evt.pointerId); } catch (err) {}
    }
    dragState = null;
    svg.classList.remove('is-dragging');
  }
  svg.addEventListener('pointerup', endPan);
  svg.addEventListener('pointercancel', endPan);
  svg.addEventListener('click', function() {
    if (shouldSuppressClick()) return;
    clearSelection();
    closeModal();
  });
  document.addEventListener('keydown', function(evt) {
    if (evt.key === 'Escape') {
      closeDrawer();
      closeModal();
      clearSelection();
    }
  });
  window.addEventListener('resize', syncFloatingLayout);
  loadSavedLayout();
  loadAccessConfig();
  renderQuickChips();
  draw();
})();
</script>
</body>
</html>
