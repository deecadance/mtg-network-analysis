      margin-left: auto;

        var p = pos[n.id];

      if (freshNodes[i]) { n.x = freshNodes[i].x; n.y = freshNodes[i].y; }
    });
    draw();
  });
  loadAccessConfig();
  renderQuickChips();
  draw();
})();
</script>
