      --text: #ecf2fb;

    * { box-sizing: border-box; }
    body {

      color: var(--text);

    }

      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      pointer-events: none;
    }
    .toolbar .group, .panel, .selection, .mini-nav, .legend-panel {

      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);

    .title-wrap strong { display: block; font-size: 16px; }
    .title-wrap span { color: var(--muted); font-size: 12px; }
    .canvas-wrap {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }
    svg.is-dragging { cursor: grabbing; }
    .map-controls {
      position: fixed;
      left: 16px;
      top: 96px;
      z-index: 9;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      max-width: min(420px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
      pointer-events: auto;
    }
    .map-controls .hint {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .mini-nav {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 8;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px 12px;
      max-width: min(360px, calc(100vw - 32px));
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
    }
    .mini-nav strong { display: block; margin: 0; }
    .mini-nav-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }
    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .mini-nav .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255,255,255,0.04);
    }
    .chip small {
      color: var(--muted);
      font-size: 11px;
    }
    .chip-button {
      padding: 4px 8px;
      font-size: 12px;
      background: rgba(255,255,255,0.04);
      color: var(--muted);
    }
    .chip-button.active {
      background: rgba(92, 200, 255, 0.18);
      border-color: rgba(92, 200, 255, 0.45);
      color: var(--text);
    }
    .chip-button.is-clickable { cursor: pointer; }
    .quick-note {
      min-height: 16px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .legend-panel {
      position: fixed;
      right: 16px;
      top: 86px;
      z-index: 8;
      width: min(340px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
    }
    .legend-panel strong { display: block; margin-bottom: 8px; }
    .legend-grid { display: grid; gap: 8px; }
    .legend-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .legend-samples {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 20px;
    }
    .legend-node {
      display: inline-block;
      border-radius: 50%;
      border: 2px solid rgba(236, 242, 251, 0.9);
      background: rgba(92, 200, 255, 0.35);
    }
    .legend-node.sm { width: 10px; height: 10px; }
    .legend-node.md { width: 16px; height: 16px; }
    .legend-node.lg { width: 24px; height: 24px; }
    .legend-node.pick { background: rgba(244, 201, 93, 0.42); }
    .legend-edge {
      display: inline-block;
      width: 40px;
      border-top: 2px solid rgba(92, 200, 255, 0.9);
      border-radius: 999px;
    }
    .legend-edge.strong { border-top-width: 6px; }
    .legend-edge.pick { border-top-color: rgba(244, 201, 93, 0.92); }
    .legend-edge.none {
      border-top-width: 0;
      height: 10px;
      border: 1px dashed rgba(157, 175, 200, 0.45);
      width: 40px;
    }
    .legend-area {
      width: 38px;
      height: 22px;
      border-radius: 12px;
      background: rgba(92, 200, 255, 0.14);
      border: 1px solid rgba(92, 200, 255, 0.25);
    }
    .selection {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 8;
      width: min(420px, calc(100vw - 32px));
      max-height: 40vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
    }
    .selection.hidden { display: none; }
    .selection strong { display: block; margin-bottom: 6px; }
    .card-modal {
      position: fixed;
      left: 50%;
      top: 86px;
      transform: translateX(-50%);
      z-index: 12;
      width: min(920px, calc(100vw - 32px));
      max-height: calc(100vh - 120px);
      overflow: auto;
      background: linear-gradient(180deg, rgba(13,20,34,0.98), rgba(10,17,31,0.98));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 28px 72px rgba(0,0,0,0.52);
      padding: 18px;
    }
    .card-modal.hidden { display: none; }
    .card-modal-grid {
      display: grid;
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
      gap: 18px;
    }
    .card-modal-close {
      position: sticky;
      top: 0;
      float: right;
      margin-left: auto;
      margin-bottom: 10px;
    }
    .card-shot {
      width: 100%;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      overflow: hidden;
      min-height: 340px;
    }
    .card-shot img {
      display: block;
      width: 100%;
      height: auto;
    }
    .card-shot .muted {
      padding: 12px;
    }
    .spotlight-head {

      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

      font-size: 28px;
      line-height: 1.1;
    }
    .spotlight-badges {

      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .spotlight-grid {

      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .spotlight-kpi .muted {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .spotlight-kpi strong {

      margin-top: 4px;
      font-size: 18px;
    }
    .spotlight-section {

      padding-top: 14px;

      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;

      top: 0;
      right: 0;

      color: var(--muted);

      letter-spacing: 0.08em;

      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 10px;

    .muted { color: var(--muted); }
    .overlay-link {
      position: fixed;
      inset: 0;
      z-index: 14;
      display: none;
      background: rgba(0, 0, 0, 0.25);

    .hidden { display: none !important; }
    .overlay-link.open { display: block; }

      .selection { left: 10px; right: 10px; width: auto; }

      segment.nodes.forEach(function(n) {
        var p = pos[n.id];

  });
  window.addEventListener('resize', syncFloatingLayout);
  document.getElementById('exportLayoutBtn').addEventListener('click', _exportAllLayouts);
  document.getElementById('resetLayoutBtn').addEventListener('click', function() {
    _resetLayout();
    // Reload positions from payload (re-parse to get original coords)
    var fresh = JSON.parse(document.getElementById('payloadData').textContent);
    var freshNodes = fresh.segment.nodes;
    segment.nodes.forEach(function(n, i) {
      if (freshNodes[i]) { n.x = freshNodes[i].x; n.y = freshNodes[i].y; }
    });
    draw();
  });
  loadAccessConfig();
  renderQuickChips();
  draw();
})();
</script>
</body>
</html>
